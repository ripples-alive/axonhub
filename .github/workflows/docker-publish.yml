# Publish Docker image

name: Publish Docker image

on:
  push:
    branches:
      - 'ripples/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve image tags and write VERSION
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PUBLISH_LATEST=true
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            TAG="${BRANCH#ripples/}"
            TAG="${TAG//\//-}"
            PUBLISH_LATEST=false
          fi

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/axonhub"
          SHA_TAG="sha-${GITHUB_SHA::12}"

          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "SHA_TAG=${SHA_TAG}" >> "${GITHUB_ENV}"
          echo "PUBLISH_LATEST=${PUBLISH_LATEST}" >> "${GITHUB_ENV}"
          echo "${TAG}" > internal/build/VERSION

          echo "Building ${IMAGE}:${TAG}-${{ matrix.arch }} and ${IMAGE}:${SHA_TAG}-${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}

      - name: Build & push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
            ${{ env.IMAGE }}:${{ env.SHA_TAG }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create_manifests:
    name: Create multi-arch manifests (GHCR)
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tags
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PUBLISH_LATEST=true
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            TAG="${BRANCH#ripples/}"
            TAG="${TAG//\//-}"
            PUBLISH_LATEST=false
          fi

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/axonhub"
          SHA_TAG="sha-${GITHUB_SHA::12}"

          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "SHA_TAG=${SHA_TAG}" >> "${GITHUB_ENV}"
          echo "PUBLISH_LATEST=${PUBLISH_LATEST}" >> "${GITHUB_ENV}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (version)
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

      - name: Create & push manifest (commit SHA)
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${SHA_TAG}" \
            "${IMAGE}:${SHA_TAG}-amd64" \
            "${IMAGE}:${SHA_TAG}-arm64"

      - name: Create & push manifest (latest for release tags)
        if: env.PUBLISH_LATEST == 'true'
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
